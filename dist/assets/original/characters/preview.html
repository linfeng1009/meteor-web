<!doctype html><meta charset="utf-8"><title>Native character verification</title><style>html,body{margin:0;background:#18252d;color:white;font:16px sans-serif}#label{position:absolute;top:14px;left:20px}canvas{display:block}</style><div id="label">Loading original SKC / BNC / AMB…</div><script type="module">
import*as T from'/vendor/three.module.js';import{loadNativeCharacter}from'/native-character.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#18252d');scene.add(new T.HemisphereLight(0xc7edff,0x53504a,2.8));const light=new T.DirectionalLight(0xffe9cc,3);light.position.set(3,6,5);scene.add(light);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(4,3.4,8);camera.lookAt(0,1.4,0);const floor=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:0x314552,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;scene.add(floor);scene.add(new T.GridHelper(20,20,0x506573,0x3c505e));const c=await loadNativeCharacter(Number(new URLSearchParams(location.search).get('id')||0));scene.add(c.group);c.group.rotation.y=-.3;window.nativeCharacter=c;window.nativeRenderer=renderer;window.nativeScene=scene;window.nativeCamera=camera;const clock=new T.Clock();document.getElementById('label').textContent='Original p'+c.group.userData.characterId+' / 30 bones / live AMB idle';window.characterReady=true;function frame(){requestAnimationFrame(frame);c.update(clock.getDelta());renderer.render(scene,camera);}frame();
</script>
