<!doctype html><meta charset="utf-8"><title>原步法与火铳瞄准验收</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;overflow:auto;background:#142029;color:#eee;font:16px system-ui}header{padding:12px}button{padding:12px;margin-right:12px}#view{position:relative;height:72vh}canvas{display:block;width:100%;height:100%}pre{margin:12px;white-space:pre-wrap}#musket-reticle small{font:14px system-ui}</style>
<header>原角色步幅 / 跳跃下降段 / 第一人称举枪与射击<br><br><button id="walk">测量四向步法与跳距</button><button id="aim">举枪瞄准（不射击）</button><button id="fire">按准星射击</button><button id="lower">防御收枪</button></header><div id="view"><canvas></canvas><div id="musket-reticle" class="hidden"><span></span><small>移动鼠标瞄准 · 攻击射击 · 防御或跳跃收枪</small></div></div><pre id="state">载入原资源…</pre>
<script type="module">
import {MeteorGame} from '/engine.js';import * as T from '/vendor/three.module.js';
const state=document.querySelector('#state'),reticle=document.querySelector('#musket-reticle');
const game=new MeteorGame(document.querySelector('canvas'),{onUpdate:s=>reticle.classList.toggle('hidden',!s.musketAim)});await game.ready;game.frameOverlay.setVisible(false);await game.start({map:'sifang',weapon:'sword',mode:'training'});game.pause(true);
const target=game.enemies[0];for(const other of game.enemies.slice(1)){other.root.removeFromParent();other.character.dispose();}game.enemies=[target];target.scriptControlled=true;target.scriptControl={paused:true};
const spawn=game.hero.root.position.clone();
function reset(){game.releaseInput();game._placeFighter(game.hero,{position:spawn});game._placeFighter(target,{position:spawn.clone().add(new T.Vector3(0,0,-8))});game.locked=null;game.cameraAngle=0;game.hero.root.rotation.y=Math.PI;game.localControl.lookLocked=true;game.localControl.aimPitch=0;target.scriptControlled=true;target.scriptControl={paused:true};}
function ticks(n){for(let i=0;i<n;i++)game._advanceWorld(1/60);}
function show(value){game.pause(true);game._tickCamera(1);game._hud();game.renderer.render(game.scene,game.camera);state.textContent=JSON.stringify(value,null,2);}
document.querySelector('#walk').onclick=async()=>{game.pause(true);await game.setWeapon('sword');const result=[];for(const crouch of [false,true])for(const direction of ['forward','right','left','back']){reset();game.pause(false);if(crouch)game.action('crouch');game.action(direction);const start=game.hero.root.position.clone();ticks(60);const distance=game.hero.root.position.distanceTo(start),pose=game.hero.combat.timeline.pose.id;game.action(direction,false);const stop=game.hero.root.position.clone();ticks(6);result.push({crouch,direction,pose,distance1s:+distance.toFixed(3),slideAfterRelease:+game.hero.root.position.distanceTo(stop).toFixed(6)});game.pause(true);}for(const direction of ['forward','right','left','back']){reset();game.pause(false);game.action(direction);game.action('jump');let n=0,top=0;for(;n<120;n++){ticks(1);top=Math.max(top,game.hero.root.position.y-spawn.y);if(game.hero.grounded)break;}result.push({jump:direction,timeSeconds:+((n+1)/60).toFixed(3),distance:+game.hero.root.position.distanceTo(spawn).toFixed(3),height:+top.toFixed(3)});game.pause(true);}show(result);};
document.querySelector('#aim').onclick=async()=>{game.pause(true);await game.setWeapon('musket');reset();game.pause(false);game.action('attack');ticks(70);game.action('forward');ticks(10);game.action('forward',false);game.directionBuffer=[];show({aim:game.hero.musketAim,pose:game.hero.combat.timeline.pose.id,moved:game.hero.root.position.distanceTo(spawn),targetHp:target.hp,cameraMode:"first-person"});};
document.querySelector('#fire').onclick=()=>{game.pause(false);const hp=target.hp;game.action('attack');ticks(3);game._updatePresentation(.05);show({aim:game.hero.musketAim,pose:game.hero.combat.timeline.pose.id,targetBefore:hp,targetAfter:target.hp,blood:game.bloodFeedback.particles.filter(Boolean).length});};
document.querySelector('#lower').onclick=()=>{game.pause(false);game.action('guard');ticks(2);game.action('guard',false);show({aim:game.hero.musketAim,pose:game.hero.combat.timeline.pose.id});};state.textContent='原资源就绪';
</script>
