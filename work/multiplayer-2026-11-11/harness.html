<!doctype html><meta charset="utf-8"><title>四人盟主与死斗验收</title><style>body{margin:0;background:#142029;color:#eee;font:16px system-ui}#lobby{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button,input,select{padding:8px}canvas{width:100%;height:65vh;display:block}pre{padding:12px}#stage{position:relative}</style><div id="lobby"></div><div id="stage"><canvas></canvas></div><button id="attack">攻击</button><button id="forward">前进开关</button><button id="exit">退出房间</button><pre id="status">载入中…</pre><script type="module">
import {MeteorGame} from '/engine.js';import {NetworkLobby} from '/network-lobby.js';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status');const game=new MeteorGame(canvas,{onUpdate(){}});await game.ready;game.frameOverlay.setVisible(false);
const lobby=new NetworkLobby({getGame:()=>game,onStart:async valid=>{await game.start({map:'sifang',weapon:'sword',mode:'network'});if(!valid())return;game.frameOverlay.setVisible(false);},onStop:t=>status.textContent=t,onNotice:t=>status.textContent=t,onResult:()=>lobby.render()});lobby.mount(document.querySelector('#lobby'));
document.querySelector('#attack').onclick=()=>{game.action('attack');game.action('attack',false);};let walk=false;document.querySelector('#forward').onclick=()=>{walk=!walk;game.action('forward',walk);};document.querySelector('#exit').onclick=()=>lobby.leave();
setInterval(()=>{const session=lobby.session;if(!session)return;status.textContent=JSON.stringify({phase:lobby.client.room.phase,mode:session.rules.mode,actors:[...session.actors.values()].map(f=>({id:f.networkId,name:f.name,team:f.team,hp:f.hp,dead:f.dead,position:f.root.position.toArray().map(n=>+n.toFixed(2)),pose:f.combat.timeline?.pose.id})),controls:[...session.controls].map(([id,c])=>({id,held:[...c.keys]})),result:session.result},null,2);},500);
</script>
