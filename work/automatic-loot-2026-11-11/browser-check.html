<!doctype html><meta charset="utf-8"><title>拾取流程验收</title><style>body{margin:0;background:#172028;color:white;font:16px system-ui}header{padding:12px}button{padding:9px;margin:5px}canvas{width:100%;height:70vh;display:block}pre{margin:12px;white-space:pre-wrap}</style>
<header>四方阵原资源拾取验收 · 隔离NPC，近距离行走触发<br><button id="approach">走向地面武器</button><button id="swap">切换主副兵器</button><button id="drop">丢下副兵器</button><button id="return">离开并走回</button><button id="buff">走向增益道具</button><button id="finish">恢复演武</button></header><canvas></canvas><pre id="state">正在读取原场景…</pre>
<script type="module">
import {MeteorGame} from '/engine.js';import * as T from '/vendor/three.module.js';
let target,seen=0,events=[],pending=false,stopAtPickup=false;
const show=()=>document.querySelector('#state').textContent=JSON.stringify({primary:game.hero?.weaponName,secondary:game.weaponItems?.get(game.hero?.weapon2Id)?.name||'空',near:game.items?.peek(game.hero)?.name,worldDrops:game.droppedWeapons?.size,pickupEvents:seen,events:events.slice(-4)},null,2);
const game=new MeteorGame(document.querySelector('canvas'),{onUpdate(){if(stopAtPickup&&(game.hero.pickupSerial||0)>seen){seen=game.hero.pickupSerial;stopAtPickup=false;game.rageVfx?.update(.12,game.camera);game.pause(true);}show();},onEvent(event){if(event.type==='pickup')events.push(event.text);},onEnd(){}});
const present=game._updatePresentation.bind(game);game._updatePresentation=dt=>present(game.paused?0:dt);await game.ready;await game.start({map:'sifang',weapon:'sword',mode:'training'});for(const actor of game.enemies){actor.root.removeFromParent();actor.character.dispose();}game.enemies=[];game.pause(true);show();
function walkTo(instance){if(!instance)return;target=instance;game.pause(false);const p=instance.root.position;let start,floor;for(let i=0;i<16;i++){const a=i*Math.PI/8,candidate=p.clone().add(new T.Vector3(Math.sin(a)*2.3,0,Math.cos(a)*2.3));const hit=game._ground(candidate.x,candidate.z,p.y+1);if(hit&&Math.abs(hit.point.y-p.y)<1){start=candidate;floor=hit;break;}}if(!start){stopAtPickup=false;game.rageVfx?.update(.12,game.camera);game.pause(true);document.querySelector('#state').textContent='附近没有适合直线行走的落脚点';return;}game.hero.root.position.copy(start);game.hero.root.position.y=floor.point.y+.015;game.hero.grounded=true;game.hero.vy=0;game.hero.nativeJump=null;game.cameraAngle=Math.atan2(game.hero.root.position.x-p.x,game.hero.root.position.z-p.z);game.cameraPitch=.4;game.cameraDistance=8;game.cameraTarget.copy(game.hero.root.position).add(new T.Vector3(0,1.5,0));game._tickCamera(1);seen=game.hero.pickupSerial||0;stopAtPickup=true;game.action('forward');for(let i=0;i<60&&!game.paused;i++)game._advanceWorld(1/60);game.renderer.render(game.scene,game.camera);show();}
document.querySelector('#approach').onclick=()=>walkTo([...game.currentMap.props.instances.values()].find(i=>game.items.itemsByModel.get(String(i.source.properties.model).replaceAll('"','').toLowerCase())?.kind==='weapon'&&i.attributes.active!==0));
document.querySelector('#swap').onclick=async()=>{game.pause(false);await game.action('switch');game.pause(true);show();};
document.querySelector('#drop').onclick=async()=>{game.pause(false);await game.action('drop');game.pause(true);show();};
document.querySelector('#return').onclick=()=>walkTo([...game.droppedWeapons.values()][0]);
document.querySelector('#buff').onclick=()=>walkTo([...game.currentMap.props.instances.values()].find(i=>{const e=game.items.itemsByModel.get(String(i.source.properties.model).replaceAll('"','').toLowerCase());return e&&e.kind!=='weapon'&&!e.heal&&i.attributes.active!==0;}));
document.querySelector('#finish').onclick=()=>{game.action('forward',false);stopAtPickup=false;game.pause(false);};
</script>
