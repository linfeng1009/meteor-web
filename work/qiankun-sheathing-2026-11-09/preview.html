<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>乾坤刀收刀验证</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111923;color:#e8dfc2;font:14px system-ui}body{display:flex;flex-direction:column}nav{padding:8px;text-align:center;flex:none}button{padding:6px 10px;margin:2px;border:1px solid #53616d;border-radius:3px;background:#253342;color:#e8dfc2}.labels{display:flex;justify-content:space-around;font-weight:bold;margin-bottom:6px}.labels span{width:50%}#info{font-size:11px;color:#afb9c6;min-height:16px}#stage{flex:1;min-height:0}canvas{display:block}</style><nav><div class="labels"><span>修复前 · 刀仍在手中</span><span>修复后 · 刀身入鞘</span></div><button id="raised">持刀举起</button><button id="close">↓↓A 收刀</button><button id="closed">收刀后</button><button id="draw">↓↑A 拔刀</button><button id="toggle">暂停</button><button id="step">逐帧</button><div id="info">读取原版模型…</div></nav><main id="stage"></main><script type="module">
import * as THREE from '../../dist/vendor/three.module.js';import{loadNativeCharacter}from'../../dist/native-character.js';import{loadNativeCombat,NativeCombatController}from'../../dist/native-combat.js';import{MeteorGame}from'../../dist/engine.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#111923');scene.add(new THREE.HemisphereLight(0xffffff,0x444b63,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,7);scene.add(light);scene.add(new THREE.GridHelper(15,30,0x465665,0x253342));const camera=new THREE.PerspectiveCamera(40,1,.01,100);camera.position.set(0,3.4,8.2);camera.lookAt(0,1.7,0);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(devicePixelRatio);renderer.outputColorSpace=THREE.SRGBColorSpace;const stage=document.querySelector('#stage');stage.append(renderer.domElement);function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
const data=await loadNativeCombat(),weapons=await(await fetch('../../dist/assets/original/weapon-models/manifest.json')).json(),games=[];
for(let side=0;side<2;side++){const character=await loadNativeCharacter(0,{inPlace:true}),actor={hero:true,root:character.group,character,grounded:true,rage:100,combat:new NativeCombatController(data)};actor.root.position.x=side?1.6:-1.6;actor.root.rotation.y=-.2;scene.add(actor.root);const game=Object.create(MeteorGame.prototype);Object.assign(game,{hero:actor,combatData:data,weaponItems:new Map(weapons.items.map(w=>[w.itemId,w])),weaponModels:new Map(weapons.models.map(m=>[m.modelId.toLowerCase(),m])),weaponCache:new Map(),infiniteRage:true,keys:new Set(),directionBuffer:[],elapsed:0,mode:'training',running:true,paused:false,_hud(){},_unlockAudio(){},onEvent(){}});await game._equip(actor,'qiankun');if(!side){actor.weaponPoseUnsubscribe();actor.weaponPoseUnsubscribe=null;for(const model of actor.weaponModels){model.matrixAutoUpdate=true;character.getAttachment(/l$/i.test(model.name)?'d_wpnLP':'d_wpnRP').add(model);}}games.push(game);}
function input(keys){for(const game of games){for(const key of keys){game.action(key);game.action(key,false);game.elapsed+=.04;}game.action('attack');game.action('attack',false);}}
function advance(dt){for(const game of games){game.elapsed+=dt;const a=game.hero;if(!a.combat.busy&&a.combat.timeline.pose.id!==a.combat.stance)a.combat.play(a.combat.stance,{loop:true,force:true});const s=a.combat.update(dt,{grounded:true});if(s.blend)a.character.setPoseBlend(s.blend.from,s.blend.to,s.blend.weight);else a.character.setPoseFrame(s.source,s.frame);}const a=games[1].hero;document.querySelector('#info').textContent=`原版动作 ${a.combat.timeline.pose.id} · 帧 ${a.character.frame.toFixed(2)} · 入鞘 ${Math.round((a.qiankunSheathWeight||0)*100)}%`;}
function reset(){for(const g of games){g.hero.combat.setWeapon('qiankun');g.hero.combat.play(401,{loop:true,force:true});g.directionBuffer=[];g.keys.clear();}advance(0);}
function closed(){reset();input(['back','back']);for(let n=0;n<200;n++)advance(1/60);}
let playing=true;document.querySelector('#raised').onclick=reset;document.querySelector('#close').onclick=()=>{reset();input(['back','back']);playing=true;};document.querySelector('#closed').onclick=()=>{closed();playing=false;};document.querySelector('#draw').onclick=()=>{closed();input(['back','forward']);playing=true;};document.querySelector('#toggle').onclick=()=>{playing=!playing;};document.querySelector('#step').onclick=()=>{playing=false;advance(1/60);};reset();let last=performance.now();function render(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(playing)advance(dt);renderer.render(scene,camera);requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
