<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>乾坤刀挂点对照</title><style>body{margin:0;background:#111923;color:#e8dfc2;font:16px system-ui}canvas{display:block;width:100vw;height:calc(100vh - 85px)}nav{height:85px;text-align:center;box-sizing:border-box;padding:8px}button{margin:5px;padding:8px 16px}#info{font-size:13px;color:#afb9c6}label{margin:0 7vw}</style><nav><div><label>修复前 · 腰部错位</label><label>修复后 · 手部握持</label></div><button data-pose="401">持刀式</button><button data-pose="402">持枪式</button><button data-pose="403">拔刀式</button><button data-pose="432">第一式起手</button><div id="info">读取原版人物与杖刀林…</div></nav><script type="module">
import * as THREE from '../../dist/vendor/three.module.js';import{loadNativeCharacter}from'../../dist/native-character.js';import{loadNativeCombat,NativeCombatController}from'../../dist/native-combat.js';import{MeteorGame}from'../../dist/engine.js';import{loadGmb}from'../../dist/gmc-loader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#111923');const camera=new THREE.PerspectiveCamera(38,innerWidth/(innerHeight-85),.01,100);camera.position.set(0,4,8);camera.lookAt(0,1.9,0);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight-85);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x444b63,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,5,8);scene.add(light);const grid=new THREE.GridHelper(15,30,0x465665,0x253342);scene.add(grid);
const data=await loadNativeCombat(),actors=[],weapons=await(await fetch('../../dist/assets/original/weapon-models/manifest.json')).json();const game=Object.create(MeteorGame.prototype);Object.assign(game,{combatData:data,weaponItems:new Map(weapons.items.map(w=>[w.itemId,w])),weaponModels:new Map(weapons.models.map(m=>[m.modelId.toLowerCase(),m])),weaponCache:new Map()});
for(let side=0;side<2;side++){const c=await loadNativeCharacter(0,{inPlace:true}),group=c.group;group.position.x=side?1.6:-1.6;group.rotation.y=-.2;scene.add(group);if(side){await game._equip({character:c,root:group,combat:new NativeCombatController(data),hero:false},'qiankun');}else for(const hand of['r','l']){const id='w9_0'+hand;const m=await loadGmb(new URL(`../../dist/assets/original/weapon-models/models/${id}/${id}.gmb`,location.href).href,{scale:1,groundZ:0,unlit:true,texturePath:new URL(`../../dist/assets/original/weapon-models/models/${id}/textures/`,location.href).href});m.name=id;m.rotation.x=Math.PI/2;c.getAttachment('d_wpn'+hand.toUpperCase()+(side?'P':'')).add(m);}actors.push(c);}
const show=id=>{const p=data.poses.get(id);for(const c of actors)c.setPoseFrame(p.source,p.entryFrame);document.querySelector('#info').textContent='原始姿态 '+id+' / '+p.entryFrame+' · 原版 p0 / w9_0r / w9_0l';renderer.render(scene,camera);};for(const b of document.querySelectorAll('button'))b.onclick=()=>show(Number(b.dataset.pose));show(401);addEventListener('resize',()=>{camera.aspect=innerWidth/(innerHeight-85);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight-85);renderer.render(scene,camera);});
</script></html>
