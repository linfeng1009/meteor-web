<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>怒气技能光效验证</title><style>html,body{margin:0;height:100%;background:#101820;color:#d6dce2;font:13px system-ui}canvas{display:block;width:100%;height:100%}.controls{position:fixed;left:14px;top:12px;right:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #8da4ac;color:#d8e8f0;background:#17252bee;padding:7px;font:12px system-ui;min-height:34px}p{position:fixed;bottom:8px;left:16px;color:#d9cfae;font-size:12px;pointer-events:none}</style><canvas></canvas><div class="controls"><select aria-label="预览怒气招式" id="move"></select><button id="charge">蓄力帧</button><button id="release">释放帧</button><button id="play">播放招式</button><button id="pause">暂停</button></div><p id="status">正在载入原版模型与特效…</p><script type="module">
import * as THREE from './vendor/three.module.js';
import {loadNativeCharacter} from './native-character.js';
import {loadNativeCombat,NativeCombatController} from './native-combat.js';
import {NATIVE_MOVE_CATALOG} from './native-move-catalog.js';
import {loadNativeRageVfx} from './native-rage-vfx.js';
import {MeteorGame} from './engine.js';
import {createPhoenixSpear} from './phoenix-spear.js';
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1.5);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x111b25);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);camera.position.set(9,6,13);camera.lookAt(0,1.4,2.3);scene.add(new THREE.HemisphereLight(0xffffff,0x596675,2.7));const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-20,50,30);scene.add(key);scene.add(new THREE.GridHelper(24,24,0x53636d,0x243441));
const [character,data,vfx,wm]=await Promise.all([loadNativeCharacter(0),loadNativeCombat(),loadNativeRageVfx(scene),fetch('./assets/original/weapon-models/manifest.json').then(r=>r.json())]);const actor={character,root:character.group,weaponModels:[],weaponModel:null,combat:null};scene.add(actor.root);const moves=NATIVE_MOVE_CATALOG.filter(m=>m.rage>0&&!m.pending);const select=document.querySelector('#move');for(const move of moves){const option=document.createElement('option');option.value=move.poseId;option.textContent=move.name+' · '+move.rage+'怒气';select.append(option);}select.value=571;
const weaponModels=new Map(wm.models.map(m=>[m.modelId.toLowerCase(),m])),models={spear:'w7_0',sword:'w0_0',blade:'w5_0',dagger:'w1_0',dual:'w8_0r',hammer:'w4_0'};
let current,playing=false,time=0,skin,manualTime=.67;
async function choose(){playing=false;vfx.clear();for(const old of actor.weaponModels)old.removeFromParent();skin?.removeFromParent();current=moves.find(m=>m.poseId===Number(select.value));const model=await MeteorGame.prototype._readWeapon.call({weaponModels},models[current.weapon]);await model.userData.texturesReady;model.rotation.x=Math.PI/2;character.getAttachment('d_wpnR').add(model);actor.weaponModel=model;actor.weaponModels=[model];if(current.weapon==='spear'){skin=createPhoenixSpear();skin.rotation.x=Math.PI/2;character.getAttachment('d_wpnR').add(skin);model.visible=false;}actor.combat=new NativeCombatController(data,{weapon:current.weapon});frame(.67);document.title='怒气特效已就绪';}
function frame(seconds,phase){vfx.clear();const id=phase||current.poseId,pose=data.poses.get(id);character.setPoseFrame(pose.source,Math.min(pose.end,pose.start+seconds*30));vfx.sample(actor,{pose,frame:pose.start+seconds*30,serial:1,context:current});vfx.update(0,camera);skin?.userData.update(seconds);document.querySelector('#status').textContent=current.name+' · 原版 EF 视觉 · '+seconds.toFixed(2)+' 秒';renderer.render(scene,camera);}
select.onchange=choose;document.querySelector('#charge').onclick=()=>{playing=false;frame(.36);};document.querySelector('#release').onclick=()=>{playing=false;frame(current.poseId===293?.57:.72,current.poseId===293?294:current.poseId===562?563:undefined);};document.querySelector('#play').onclick=()=>{vfx.clear();actor.combat.attack({poseId:current.poseId,context:current});playing=true;};document.querySelector('#pause').onclick=()=>{playing=false;};
let previous=performance.now();function loop(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(playing){const state=actor.combat.update(dt,{grounded:true});character.setPoseFrame(state.source,state.frame);vfx.sample(actor,state);vfx.update(dt,camera);time+=dt;skin?.userData.update(time);document.querySelector('#status').textContent=current.name+' · 播放中';if(state.finished){playing=false;}}renderer.render(scene,camera);requestAnimationFrame(loop);}await choose();requestAnimationFrame(loop);
</script></html>
