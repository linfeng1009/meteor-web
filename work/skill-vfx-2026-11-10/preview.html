<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>技能光效对照</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#131d29;color:#edf1f5;font:12px system-ui}body{display:flex;flex-direction:column}nav{padding:4px;text-align:center;flex:none}h1{font-size:14px;margin:0 0 4px}button,select{padding:4px 5px;font-size:11px;margin:1px;border:1px solid #566575;border-radius:5px;background:#253747;color:#edf1f5;cursor:pointer}.labels{display:flex;justify-content:space-around;font-size:13px;font-weight:600;margin-top:5px}.labels span{width:50%}.labels small{display:none;font-size:12px;font-weight:400;color:#b1c0ce;margin-top:3px}#info{font-size:10px;color:#b1c0ce;min-height:18px;margin-top:7px}#stage{flex:1;min-height:0}canvas{display:block}#errors{color:#ff9e94}</style><nav><h1>乾坤刀 · 死斗</h1><button id="full">播放整套 ↓↓↑A</button><button id="final">最后一击</button><button id="slashes">六道刀光</button><select id="weapon"><option value="qiankun">乾坤刀</option><option value="spear">长枪</option><option value="sword">剑</option><option value="blade">大刀</option><option value="hammer">大锤</option></select><button id="ordinary">普通挥砍</button><button id="toggle">暂停 / 继续</button><button id="step">下一帧</button><button id="background">切换亮地面</button><div class="labels"><span>修复前<small>亮度 65% · 动作结束后仅保留 0.18 秒</small></span><span>修复后<small>原版六组刀光完整播放 · 接入原武器拖尾</small></span></div><div id="info">读取原版模型和特效…</div><div id="errors"></div></nav><main id="stage"></main><script type="module">
import * as THREE from '../../dist/vendor/three.module.js';import{loadNativeCharacter}from'../../dist/native-character.js';import{loadNativeCombat,NativeCombatController}from'../../dist/native-combat.js';import{MeteorGame}from'../../dist/engine.js';import{loadNativeRageVfx as beforeVfx}from'./native-rage-vfx-before.js';import{loadNativeRageVfx as afterVfx}from'../../dist/native-rage-vfx.js';
const errors=[];addEventListener('error',e=>{errors.push(e.message);document.querySelector('#errors').textContent=errors.join(' | ')});addEventListener('unhandledrejection',e=>{errors.push(String(e.reason));document.querySelector('#errors').textContent=errors.join(' | ')});
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setScissorTest(true);const stage=document.querySelector('#stage');stage.append(renderer.domElement);const data=await loadNativeCombat(),weapons=await(await fetch('../../dist/assets/original/weapon-models/manifest.json')).json(),games=[],scenes=[],cameras=[];let width,height,playing=false,busy=false,bright=false;
for(let side=0;side<2;side++){const scene=new THREE.Scene();scene.background=new THREE.Color('#172332');scene.add(new THREE.HemisphereLight(0xe9f5ff,0x596372,2));const light=new THREE.DirectionalLight(0xfff0d6,2);light.position.set(3,5,7);scene.add(light);const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x273b48,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);scene.userData.ground=ground;scene.add(new THREE.GridHelper(40,40,0x627889,0x354e5e));const camera=new THREE.PerspectiveCamera(40,1,.01,150);camera.position.set(6.8,5.5,10);camera.lookAt(0,1.5,3);const character=await loadNativeCharacter(0,{inPlace:true}),actor={hero:true,root:character.group,character,grounded:true,rage:100,combat:new NativeCombatController(data),hp:1000};scene.add(actor.root);const target=await loadNativeCharacter(8,{inPlace:true});target.group.position.z=5.3;target.group.rotation.y=Math.PI;target.setPoseFrame(0,data.poses.get(0).start);scene.add(target.group);const game=Object.create(MeteorGame.prototype);Object.assign(game,{hero:actor,combatData:data,weaponItems:new Map(weapons.items.map(w=>[Number(w.itemId),w])),weaponModels:new Map(weapons.models.map(m=>[m.modelId.toLowerCase(),m])),weaponCache:new Map(),infiniteRage:false,keys:new Set(),directionBuffer:[],elapsed:0,mode:'training',running:true,paused:false,_hud(){},_unlockAudio(){},onEvent(){}});game.rageVfx=await(side?afterVfx:beforeVfx)(scene);await game._equip(actor,'qiankun');actor.combat.play(401,{loop:true,force:true});games.push(game);scenes.push(scene);cameras.push(camera);}
function input(keys){for(const g of games){for(const key of keys){g.action(key);g.action(key,false);g.elapsed+=.04;}g.action('attack');g.action('attack',false);}}
function advance(dt){for(let i=0;i<2;i++){const g=games[i],a=g.hero;g.elapsed+=dt;if(!a.combat.busy&&a.combat.timeline.pose.id!==a.combat.stance)a.combat.play(a.combat.stance,{loop:true,force:true});const s=a.combat.update(dt,{grounded:true});if(s.blend)a.character.setPoseBlend(s.blend.from,s.blend.to,s.blend.weight);else a.character.setPoseFrame(s.source,s.frame);g.rageVfx.sample(a,s,a.combat.fps);g.rageVfx.update(dt,cameras[i]);}const a=games[1].hero,e=games[1].rageVfx.active.find(e=>e.id==='pos456'),slash=games.map(g=>g.rageVfx.active.flatMap(e=>e.nodes).filter(n=>/^SLASH/.test(n.source.name)&&n.mesh?.visible).length);document.querySelector('#info').textContent=`原动作 ${a.combat.timeline.pose.id} · 帧 ${a.character.frame.toFixed(2)} · 末击特效 ${e?e.time.toFixed(2):'已结束'} 秒 · 当前刀光 ${slash[0]} → ${slash[1]} · 怒气 ${a.rage} · 错误 ${errors.length}`;}
async function reset(weapon='qiankun'){for(const g of games){g.rageVfx.clear();await g._equip(g.hero,weapon);g.hero.combat.setWeapon(weapon);g.hero.combat.play(g.hero.combat.stance,{loop:true,force:true});g.hero.rage=100;g.directionBuffer=[];g.keys.clear();}advance(0);}
async function ultimate(mode){document.querySelector('h1').textContent='乾坤刀 · 死斗';for(const c of cameras){c.position.set(6.8,5.5,10);c.lookAt(0,1.5,3);}if(busy)return;busy=true;playing=false;await reset();input(['back','back']);for(let n=0;n<200;n++)advance(1/60);for(const g of games)g.rageVfx.clear();input(['back','back','forward']);if(mode!=='full'){let guard=0;while(games[1].hero.combat.timeline.pose.id!==456&&guard++<600)advance(1/60);if(mode==='slashes'){let guard=0;while((games[1].rageVfx.active.find(e=>e.id==='pos456')?.time||0)<2.05&&guard++<250)advance(1/60);}else for(let n=0;n<45;n++)advance(1/60);}playing=mode==='full';busy=false;}
document.querySelector('#full').onclick=()=>ultimate('full');document.querySelector('#final').onclick=()=>ultimate('final');document.querySelector('#slashes').onclick=()=>ultimate('slashes');document.querySelector('#ordinary').onclick=async()=>{playing=false;await reset(document.querySelector('#weapon').value);document.querySelector('h1').textContent=document.querySelector('#weapon').selectedOptions[0].textContent+' · 原武器拖尾';for(const c of cameras){c.position.set(4.7,3.8,7.2);c.lookAt(0,1.45,0);}input([]);const p=games[1].hero.combat.timeline.pose,d=p.drags?.[0],goal=d?(d.start+d.end)/2:p.start+5;let guard=0;while(games[1].hero.combat.timeline.frame<goal&&guard++<180)advance(1/60);playing=false;};document.querySelector('#toggle').onclick=()=>{playing=!playing;};document.querySelector('#step').onclick=()=>{playing=false;advance(1/60);};document.querySelector('#background').onclick=()=>{bright=!bright;for(const scene of scenes){scene.background.set(bright?'#8c9fa8':'#172332');scene.userData.ground.material.color.set(bright?'#acb8b5':'#273b48');}};
function resize(){width=stage.clientWidth;height=stage.clientHeight;renderer.setSize(width,height);for(const camera of cameras){camera.aspect=width/2/height;camera.updateProjectionMatrix();}}addEventListener('resize',resize);resize();await reset();let last=performance.now();function render(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(playing&&!busy)advance(dt);for(let side=0;side<2;side++){renderer.setViewport(side*width/2,0,width/2,height);renderer.setScissor(side*width/2,0,width/2,height);renderer.render(scenes[side],cameras[side]);}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
