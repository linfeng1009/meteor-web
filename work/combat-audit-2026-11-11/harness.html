<!doctype html><meta charset="utf-8"><title>中毒与减速战斗状态验收</title><style>body{margin:0;background:#142029;color:white;font:16px system-ui}header{padding:12px}button{padding:12px}canvas{width:100%;height:72vh;display:block}pre{white-space:pre-wrap}</style><header>原AttrPOIS：三组绿色ZS2粒子 / 网页运动适配<br><button id="slow">施加原钝筋</button><button id="apply">施加蛊毒并推进1秒</button><button id="move">移动中毒角色</button><button id="expire">推进至毒效到期</button><button id="clear">重生清除</button></header><canvas></canvas><pre>载入中…</pre><script type="module">
import {MeteorGame} from '/engine.js';import * as T from '/vendor/three.module.js';
const game=new MeteorGame(document.querySelector('canvas'),{onUpdate(){}});await game.ready;await game.start({map:'sifang',weapon:'dart',mode:'training'});game.pause(true);game.frameOverlay.setVisible(false);
const target=game.enemies[0];for(const other of game.enemies.slice(1)){other.root.removeFromParent();other.character.dispose();}game.enemies=[target];target.scriptControlled=true;target.scriptControl={paused:true};const spawn=game.hero.root.position.clone();game._placeFighter(target,{position:spawn.clone().add(new T.Vector3(0,0,-1.6))});game.cameraAngle=.45;game.cameraDistance=5;game.cameraPitch=.35;game.cameraManualUntil=Infinity;game.cameraTarget.copy(spawn).add(new T.Vector3(0,1.5,0));game._tickCamera(1);
function show(){game.poisonFeedback.update(0,[game.hero,target]);game.slowFeedback.update(0,[game.hero,target]);game.renderer.render(game.scene,game.camera);document.querySelector('pre').textContent=JSON.stringify({hp:target.hp,statuses:target.scriptItems.map(({id,name,remaining})=>({id,name,remaining})),actors:game.poisonFeedback.actors.size,particles:game.poisonFeedback.mesh.geometry.drawRange.count,slowParticles:game.slowFeedback.mesh.geometry.drawRange.count},null,2);}
function advance(seconds){game.pause(false);for(let i=0;i<seconds*60;i++){game._advanceWorld(1/60);game.poisonFeedback.update(1/60,[game.hero,target]);game.slowFeedback.update(1/60,[game.hero,target]);}game.pause(true);show();}
document.querySelector('#slow').onclick=()=>{game.useScriptItem(target,10);advance(1);};document.querySelector('#apply').onclick=()=>{game.useScriptItem(target,12);advance(1);};document.querySelector('#move').onclick=()=>{target.root.position.x+=1;advance(.5);};document.querySelector('#expire').onclick=()=>advance(61);document.querySelector('#clear').onclick=()=>{game._placeFighter(target,{position:spawn.clone().add(new T.Vector3(0,0,-1.6))});show();};show();
</script>
